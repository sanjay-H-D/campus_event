services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the project .env file}
      DATABASE_URL: sqlite:////data/campus_event_engine.db
    volumes:
      - campus_event_data:/data
    restart: unless-stopped

volumes:
  campus_event_data:
